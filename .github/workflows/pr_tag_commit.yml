name: Version Release

# Bumps VERSION from the paths a change touched (.github/bump_version.sh), tags and releases it, and
# builds the SDK archives for the tag (release_sdk.yml, called in-process: a workflow can only be
# dispatched from the default branch, and this one must also run for `next`).
#
# develop is bumped nightly; next on every push (the bump commit carries [skip ci]). A release cut
# from any branch but develop is a prerelease. Pass sdk_tag to rebuild the archives of an existing
# release without bumping anything.

on:
  schedule:
    - cron: '0 4 * * *'  # Runs at 04:00 UTC every day, on the default branch
  push:
    branches: [next]
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: "Only build and attach the SDK archives for this existing release tag"
        required: false
        default: ""

# One run per branch at a time: a push and a dispatch on the same branch would otherwise both bump
# VERSION and both build the SDK. Queued, never cancelled, so a release is not cut half-way.
concurrency:
  group: version-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bump-semver:
    runs-on: ubuntu-latest
    if: github.event.inputs.sdk_tag == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # Ensure full history for diff comparisons

      - name: Test version selection
        run: python3 .github/tests/test_bump_version.py

      - name: Run bump semver script
        run: |
          chmod +x ./.github/bump_version.sh
          ./.github/bump_version.sh

      - name: Commit version bump
        run: |
          git config user.name "MafiaHub CI"
          git config user.email "${{ secrets.MHCI_MAIL }}"
          git add VERSION || true
          git diff-index --quiet HEAD || git commit -m "ci: bump version to $(cat VERSION) [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} --follow-tags || true

  evaluate-release:
    runs-on: ubuntu-latest
    needs: bump-semver
    if: github.event.inputs.sdk_tag == ''
    outputs:
      released: ${{ steps.version-check.outputs.released }}
      tag: ${{ steps.version-check.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # Get full history for tag comparison

      - name: Read raw version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "raw_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: previous-tag
        run: |
          git fetch --tags
          # Default to v0.0.0 if no tags exist
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "prev_version=${PREV_TAG#v}" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: version-check
        run: |
          NEW_VERSION=${{ steps.version.outputs.raw_version }}
          PREV_VERSION=${{ steps.previous-tag.outputs.prev_version }}

          if [ "$NEW_VERSION" = "$PREV_VERSION" ]; then
            echo "No new version detected, skipping build"
            echo "released=false" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NEEDED=true" >> $GITHUB_ENV
            echo "new_tag=v${NEW_VERSION}" >> $GITHUB_ENV
            echo "released=true" >> $GITHUB_OUTPUT
            echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create semver tag and release
        if: env.RELEASE_NEEDED == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.new_tag }}
          name: ${{ env.new_tag }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.ref_name != 'develop' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdk:
    needs: evaluate-release
    if: needs.evaluate-release.outputs.released == 'true'
    uses: ./.github/workflows/release_sdk.yml
    with:
      tag: ${{ needs.evaluate-release.outputs.tag }}
    secrets: inherit

  rebuild-sdk:
    if: github.event.inputs.sdk_tag != ''
    uses: ./.github/workflows/release_sdk.yml
    with:
      tag: ${{ github.event.inputs.sdk_tag }}
    secrets: inherit
