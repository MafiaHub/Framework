name: Test Build

on:
    push:
         branches: [ 'master' ]
    pull_request:
         branches: [ 'develop' ]
    workflow_dispatch:

env:
    BUILD_TYPE: Debug

jobs:
  build:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            build_type: "Debug"
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
            build_type: "Debug"
            extra_cmake_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          - os: macos-latest
            cmake_generator: "Unix Makefiles"
            build_type: "Debug"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: ${{ secrets.FW_SERVICES_PAT != '' && 'recursive' || 'false' }}
          token: ${{ secrets.FW_SERVICES_PAT || github.token }}
                              
      - uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: '26.3'
        if: runner.os == 'macOS'
    
      - name: Install tools on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential g++ libcurl4-openssl-dev
          echo "Building with:"; gcc --version; g++ --version
        if: runner.os == 'Linux'

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      
      - name: Set up Visual Studio shell
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -G "${{ matrix.cmake_generator }}" -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.extra_cmake_args }}

      - name: Run the tests
        run: |
          cmake --build build --target RunFrameworkTests
