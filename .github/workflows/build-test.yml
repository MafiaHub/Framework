name: Test Build

on:
    push:
         branches: [ 'develop' ]
    pull_request:
         branches: [ 'develop' ]
         # Skip PRs that cannot change the build. This is a denylist on purpose: a file nobody
         # thought to list still builds. None of these checks is required on develop, so a skipped
         # run never blocks a merge; if one becomes required, a skipped run would stay "Pending".
         paths:
           - '**'
           - '!**.md'
           - '!docs/**'
           - '!types/**'
           - '!.github/**'
           - '.github/workflows/build-test.yml'
           - '!.claude/**'
           - '!.cursor/**'
           - '!.idea/**'
           - '!.cursorignore'
           - '!.clang-format'
           - '!.clang-tidy'
           - '!.editorconfig'
           - '!Folder.DotSettings'
           - '!CMakeSettings.json'
           - '!LICENSE.txt'
           - '!NOTICE.txt'
           # Only stamps the SDK package version; the release run builds that SDK anyway.
           - '!VERSION'
           - '!mise.toml'
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: "Git ref to test (defaults to the triggering ref)"
                required: false
                type: string

# A new push to a PR supersedes the run already testing it. Pushes to develop each keep their run.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    BUILD_TYPE: Debug
    # vcpkg binary cache. Without one, every cold runner builds openssl, curl and sentry-native
    # from source before a single Framework file compiles. The default is vcpkg's `files` backend
    # over a directory that actions/cache saves and restores (see the "vcpkg binary cache" steps).
    # GitHub scopes cache entries per ref: a PR reads what its base branch wrote, so the push
    # build of develop is what keeps PRs warm. Set the VCPKG_BINARY_SOURCES repository variable
    # to an S3/R2 or NuGet store to share one cache across every project and architecture instead.
    VCPKG_BINARY_SOURCES_OVERRIDE: ${{ vars.VCPKG_BINARY_SOURCES }}

jobs:
  build:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            build_type: "Debug"
          - os: ubuntu-latest
            cmake_generator: "Ninja"
            build_type: "Debug"
            extra_cmake_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          - os: macos-latest
            cmake_generator: "Ninja"
            build_type: "Debug"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ secrets.FW_SERVICES_PAT != '' && 'recursive' || 'false' }}
          token: ${{ secrets.FW_SERVICES_PAT || github.token }}
                              
      - uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: '26.3'
        if: runner.os == 'macOS'
    
      - name: Install tools on Ubuntu
        run: |
          sudo apt-get update
          # autoconf/automake/libtool are for vcpkg, not for us: sentry-native pulls libunwind
          # on Linux, whose port is autotools-based and refuses to configure without them.
          sudo apt-get install -y ninja-build build-essential g++ libcurl4-openssl-dev autoconf autoconf-archive automake libtool
          echo "Building with:"; gcc --version; g++ --version
        if: runner.os == 'Linux'

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      
      - name: Set up Visual Studio shell
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2

      - name: Restore the vcpkg binary cache
        if: env.VCPKG_BINARY_SOURCES_OVERRIDE == ''
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          # One entry per run so new packages are saved; restore-keys picks the newest
          # entry for this OS and manifest, then any for this OS.
          key: vcpkg-${{ runner.os }}-${{ matrix.arch || 'default' }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch || 'default' }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}-
            vcpkg-${{ runner.os }}-${{ matrix.arch || 'default' }}-

      - name: Point vcpkg at the binary cache
        shell: bash
        run: |
          if [ -n "${VCPKG_BINARY_SOURCES_OVERRIDE}" ]; then
            echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES_OVERRIDE}" >> "$GITHUB_ENV"
          else
            mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-cache"
            # cygpath: vcpkg on Windows needs a native path, not /d/a/...
            dir="${GITHUB_WORKSPACE}/.vcpkg-cache"
            if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -m "$dir")"; fi
            echo "VCPKG_BINARY_SOURCES=clear;files,${dir},readwrite" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -G "${{ matrix.cmake_generator }}" -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.extra_cmake_args }}

      - name: Run the tests
        run: |
          cmake --build build --target RunFrameworkTests

  # The threading tests under ThreadSanitizer (-DFW_SANITIZE=thread). MafiaNet is built from source
  # with the same instrumentation, so a race across the library boundary shows both sides; the
  # pinned archive is not instrumented. Any report fails the job. cmake/tsan.supp holds the
  # suppressions: third-party code only, never Framework or MafiaNet.
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A release is tested against the pinned MafiaNet archive, which this job does not use.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      # The MafiaNet ref to build. The code needs the unreleased branch of MafiaHub/MafiaNet#88;
      # once that is released and cmake/MafiaNetPin.cmake names it, this becomes the pinned tag,
      # v${MAFIANET_PIN_VERSION}.
      MAFIANET_REF: feat/receive-off-pass-thread
      # Modules that start V8 (server_*, resource*, node_*, engine and the rest of scripting) are
      # left out: libnode is not instrumented.
      FW_TEST_FILTER: world,fork_join_pool,task_scheduler,world_lock,replication_parallel,replication_threads,network_packets,delegation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ secrets.FW_SERVICES_PAT != '' && 'recursive' || 'false' }}
          token: ${{ secrets.FW_SERVICES_PAT || github.token }}

      - name: Checkout MafiaNet
        uses: actions/checkout@v5
        with:
          repository: MafiaHub/MafiaNet
          ref: ${{ env.MAFIANET_REF }}
          path: .mafianet-src
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          # autoconf/automake/libtool: see the build job. libssl-dev is for the MafiaNet build.
          sudo apt-get install -y ninja-build build-essential g++ libcurl4-openssl-dev libssl-dev autoconf autoconf-archive automake libtool
          echo "Building with:"; gcc --version; g++ --version

      # Ubuntu 24.04 runners use 32 bits of mmap randomisation, which older TSan runtimes cannot
      # map their shadow memory around.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      # Release, static: the one configuration the Framework maps every build type onto
      # (vendors/CMakeLists.txt). -g for file and line in the reports.
      - name: Build MafiaNet with ThreadSanitizer
        run: |
          cmake -S .mafianet-src -B "${RUNNER_TEMP}/mafianet-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-g -DCMAKE_CXX_FLAGS=-g \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DMAFIANET_SANITIZER=thread \
            -DMAFIANET_BUILD_SHARED=OFF -DMAFIANET_BUILD_STATIC=ON \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/mafianet-prefix"
          cmake --build "${RUNNER_TEMP}/mafianet-build"
          cmake --install "${RUNNER_TEMP}/mafianet-build"

      # Restored only: the packages are the ones the Linux build job saves.
      - name: Restore the vcpkg binary cache
        if: env.VCPKG_BINARY_SOURCES_OVERRIDE == ''
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-default-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-default-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/**') }}-
            vcpkg-${{ runner.os }}-default-

      - name: Point vcpkg at the binary cache
        run: |
          if [ -n "${VCPKG_BINARY_SOURCES_OVERRIDE}" ]; then
            echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES_OVERRIDE}" >> "$GITHUB_ENV"
          else
            mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/.vcpkg-cache,read" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DFW_MAFIANET_ROOT="${RUNNER_TEMP}/mafianet-prefix" -DFW_SANITIZE=thread

      - name: Build the tests
        run: cmake --build build --target FrameworkTests

      # halt_on_error=0 so one run lists every report; the runtime still exits non-zero when it
      # made any, and the grep covers a report that a passing exit code would hide.
      - name: Run the threading tests
        env:
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:suppressions=${{ github.workspace }}/cmake/tsan.supp
        run: |
          set -o pipefail
          build/bin/FrameworkTests 2>&1 | tee tsan.log
          if grep -q 'WARNING: ThreadSanitizer' tsan.log; then
            echo "::error::ThreadSanitizer made reports in a run that exited cleanly"
            exit 1
          fi

      - name: Summarize the reports
        if: always()
        run: |
          test -f tsan.log || exit 0
          grep 'SUMMARY: ThreadSanitizer' tsan.log | sort | uniq -c | sort -rn || echo "No ThreadSanitizer reports"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: tsan.log
          if-no-files-found: ignore
