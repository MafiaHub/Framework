# Developer tooling for this repository: `mise install` once, then `mise run <task>`.
# MSVC is not managed here; on Windows the build tasks go through builds\build.bat, which
# remains the only supported way to build there. vcpkg and CEF are fetched by CMake itself.

[tools]
# CI pins ~3.31.0 (build-test.yml); keep them in step.
cmake = "3.31"
ninja = "1.13"
node = "24"
# Pinned exactly: formatter output changes between releases, and everyone must agree on it.
"pipx:clang-format" = "23.1.3"
# Code intelligence over build/compile_commands.json (AGENTS.md, Code Intelligence).
"pipx:clangd" = "22.1.1"

[settings]
# Install pipx: tools through uv, so no separate pipx install is needed.
pipx.uvx = true

[tasks.format]
description = "Format code/framework with the pinned clang-format"
run = "bash scripts/format_codebase.sh"

[tasks.check-style]
description = "Check license headers and #pragma once usage"
run = "bash scripts/check_style.sh"

[tasks.build]
description = "Build every target"
run = "cmake -B build && cmake --build build"
run_windows = "builds\\build.bat all 64"

[tasks.test]
description = "Build and run the Framework tests"
run = "cmake -B build && cmake --build build --target RunFrameworkTests"
run_windows = "builds\\build.bat RunFrameworkTests 64"
